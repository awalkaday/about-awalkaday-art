---
layout: default
---
<article class="page-content" aria-labelledby="page-title">
    {% if page.title %}
    <h1 id="page-title" class="page-title">{{ page.title }}</h1>
  {% endif %}
    {% if page.description %}
    <p class="page-description">{{ page.description }}</p>
  {% endif %}

  {{ content }}
</article>

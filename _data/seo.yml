# Search-engine switch for the whole site.
# false = every page carries <meta name="robots" content="noindex, follow"> and robots.txt lists no sitemap:
#         printlab can be shared, previewed and validated without competing with book.awalkaday.art.
# true  = the site is indexable; each page's canonical link is its own address (site.url in _config.yml).
# Flip it on the day printlab takes over the book address (checklist: .github/README.md, section 8).
indexable: false
# Profiles of the PROJECT (not of the person); the person's own profiles are under `social` in _config.yml
project_links:
  - https://github.com/awalkaday/about-awalkaday-art
  - https://www.instagram.com/walk.day
  - https://x.com/awalkadayart
  - https://collect.awalkaday.art

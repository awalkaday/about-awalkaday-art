# -------------------------------------------------------
# book.awalkaday.art — Jekyll configuration
# Experimental subdomain: printlab.awalkaday.art
# Rename url + baseurl to match your chosen subdomain
# -------------------------------------------------------

title: "Walking Memories"
description: "Open-source artbook retracing the digital footprints of an exiled wanderer's eight-year odyssey—263 photographs, a blockchain archive, and an asylum file—told in parallel across his Belgian pixels."
author: "Chris-Armel Iradukunda (daqhris)"
logo: /assets/icons/icon-512.png        # Organization logo for the JSON-LD that jekyll-seo-tag writes
lang: "en"

# The person's own profiles (jekyll-seo-tag writes them as sameAs). Project profiles: _data/seo.yml
social:
  type: Person
  name: "Chris-Armel Iradukunda"
  links:
    - https://daqhris.com
    - https://github.com/daqhris
    - https://www.instagram.com/iamdaqhris

url: "https://printlab.awalkaday.art"   # ← change to your chosen subdomain
baseurl: ""                         # leave empty for apex subdomain

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Permalinks — mirrors GitBook's flat URL style
permalink: /:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README-lab.md
  - SUMMARY.md
  - node_modules/
  - vendor/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .github/
  - scripts/
  - docs/
  - CITATION.cff
  - _chapters/
  - "*.sh"

include:
  - .gitbook

# Collections (optional — enable if you add image series as a collection)
# collections:
#   series:
#     output: true
#     permalink: /series/:name/

# Defaults: every page uses the "page" layout unless overridden
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      image: /assets/social/share-1200x630.png      # Open Graph / Twitter card

# Navigation data file (see _data/toc.yml)
# Mirrors your SUMMARY.md structure

# Sass (if you split CSS into partials later)
sass:
  sass_dir: assets/css
  style: compressed

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
